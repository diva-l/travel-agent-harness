[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-agent-harness"
version = "0.3.0"
description = "A provider-neutral runtime harness for bounded, traceable travel agents."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Liu Weihao"}]
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn[standard]>=0.35,<1",
  "urllib3>=2.0,<3",
  "json_repair>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
]

[project.scripts]
travel-harness = "travel_agent_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
travel_agent_harness = ["web_dist/**/*"]
