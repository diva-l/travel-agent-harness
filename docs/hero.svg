<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">TravelAgentHarness — 受限、可追溯、可评测的出行规划 Agent Harness</title>
  <desc id="hero-desc">左侧为项目名与一句话简介，右侧为一次真实运行时 Trace 的示意：RL Planner 在预算约束下循环调用工具，带 checkpoint 与证据门禁。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58A6FF"/>
    </marker>
